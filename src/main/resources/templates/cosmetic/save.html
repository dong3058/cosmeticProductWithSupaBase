<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>화장품 등록 (Form)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 입력란에 에러가 있을 경우 테두리를 빨갛게 */
        .field-error {
            border-color: #dc3545;
            color: #dc3545; /* 텍스트 색상도 붉게 */
        }
        .error-text {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">화장품 등록</h2>

    <form th:action="@{/cosmetic/save}" th:object="${cosmeticDtos}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}">
            <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
        </div>

        <div class="mb-3">
            <label for="brandName" class="form-label">브랜드명</label>
            <input type="text" th:field="*{brandName}"
                   class="form-control" th:errorclass="field-error"
                   placeholder="브랜드 이름을 입력하세요">
            <div class="field-error" th:errors="*{brandName}">브랜드명 오류</div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">제품명</label>
            <input type="text" th:field="*{name}"
                   class="form-control" th:errorclass="field-error"
                   placeholder="제품명을 입력하세요">
            <div class="field-error" th:errors="*{name}">제품명 오류</div>
        </div>

        <div class="mb-3">
            <label for="primaryCategory" class="form-label">대분류</label>
            <select th:field="*{primaryCategory}" class="form-select" th:errorclass="field-error">
                <option value="">대분류 선택</option>
                <option th:each="cat : ${mainCategory}"
                        th:value="${cat}"
                        th:text="${cat.description}">스킨케어</option>
            </select>
            <div class="error-text" th:errors="*{primaryCategory}">대분류 오류</div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">상세 카테고리</label>
            <select th:field="*{category}" class="form-select" th:errorclass="field-error">
                <option value="">상세 카테고리 선택</option>
                <option th:each="sub : ${subCategory}"
                        th:value="${sub}"
                        th:text="${sub.description}">스킨/토너</option>
            </select>
            <div class="error-text" th:errors="*{category}">카테고리 오류</div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">제품 설명</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="textToEdit" class="form-label">상품정보 고지 (필수)</label>
            <textarea th:field="*{textToEdit}"
                      class="form-control" th:errorclass="field-error"
                      rows="5" placeholder="텍스트 입력"></textarea>
            <div class="error-text" th:errors="*{textToEdit}">상품정보 고지 오류</div>
        </div>

        <hr class="my-4">

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">등록하기</button>
            <a th:href="@{/}" class="btn btn-secondary">home으로 돌아가기</a>
        </div>
    </form>
</div>

</body>
</html>
