<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>화장품 정보 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .field-error { border-color: #dc3545; color: #dc3545; }
    .error-text { color: #dc3545; font-size: 0.875em; margin-top: 0.25rem; }
  </style>
</head>
<body>

<div class="container mt-5">
  <h2 class="mb-4">화장품 정보 수정</h2>

  <form th:action="@{/cosmetic/{id}/edit(id=${form.id})}" th:object="${form}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
      <label for="brand" class="form-label">브랜드</label>
      <input type="text" id="brand" th:field="*{brand}"
             class="form-control" placeholder="브랜드명 입력 (비워두면 null)">
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">제품명</label>
      <input type="text" id="name" th:field="*{name}"
             class="form-control" placeholder="제품명 입력 (비워두면 null)">
    </div>

    <div class="mb-3">
      <label for="primaryCategory" class="form-label">대분류</label>
      <input type="text" id="primaryCategory" th:field="*{primaryCategory}"
             class="form-control"
             placeholder="대분류 입력(비워두면 null)">
    </div>

    <div class="mb-3">
      <label for="category" class="form-label">상세 카테고리</label>
      <input type="text" id="category" th:field="*{category}"
             class="form-control"
             placeholder="카테고리 입력(비워두면 null)">
    </div>

    <hr class="my-4">

    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
      <button type="submit" class="btn btn-primary">수정 완료</button>
      <a th:href="@{/}" class="btn btn-secondary">취소</a>
    </div>

  </form>
</div>

</body>
</html>
